services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: learning
      POSTGRES_DB: learning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORDを設定してください}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
