[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nyaran", email = "nyaran2910@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
]

[tool.fastapi]
entrypoint = "api.main:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
